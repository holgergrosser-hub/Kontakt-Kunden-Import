<title>OnlineCert Systemkarte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--surface-2:#E9EDF2;--ink:#1B2430;--muted:#5B6675;--line:#D3D9E1;--line-strong:#AEB8C4;
  --accent:#1B4F94;--accent-ink:#FFFFFF;--focus:#F2A93B;
  --c-rolle:#B7791F;--c-rolle-bg:#FFF4DC;--c-front:#0F766E;--c-front-bg:#DDF4F1;--c-back:#1B4F94;--c-back-bg:#DEE8F7;
  --c-daten:#6D4BB5;--c-daten-bg:#ECE5F9;--c-extern:#3F7D2F;--c-extern-bg:#E2F1DC;--c-phase:#8A3F6A;--c-phase-bg:#F6E3EE;
  --ok:#2E8B57;--warn:#D98E04;--crit:#C0392B;--shadow:0 10px 30px rgba(27,36,48,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161C;--surface:#1B222B;--surface-2:#232C37;--ink:#E6EAF0;--muted:#98A4B4;--line:#2C3641;--line-strong:#4A5765;
  --accent:#7FB0F0;--accent-ink:#0E1620;--focus:#F2A93B;
  --c-rolle:#F0B860;--c-rolle-bg:#3A2E15;--c-front:#5FD1C5;--c-front-bg:#12332F;--c-back:#8FBBF5;--c-back-bg:#172A45;
  --c-daten:#B79CF2;--c-daten-bg:#2A2144;--c-extern:#8CD27A;--c-extern-bg:#1E3319;--c-phase:#E48EC0;--c-phase-bg:#3B1E30;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#12161C;--surface:#1B222B;--surface-2:#232C37;--ink:#E6EAF0;--muted:#98A4B4;--line:#2C3641;--line-strong:#4A5765;
  --accent:#7FB0F0;--accent-ink:#0E1620;--focus:#F2A93B;
  --c-rolle:#F0B860;--c-rolle-bg:#3A2E15;--c-front:#5FD1C5;--c-front-bg:#12332F;--c-back:#8FBBF5;--c-back-bg:#172A45;
  --c-daten:#B79CF2;--c-daten-bg:#2A2144;--c-extern:#8CD27A;--c-extern-bg:#1E3319;--c-phase:#E48EC0;--c-phase-bg:#3B1E30;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 340px;grid-template-areas:"bar bar" "map panel"}
.bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;margin-right:6px}
.brand b{font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs button:focus-visible,.ctl button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.search{display:flex;align-items:center;gap:6px;flex:1 1 180px;min-width:140px;max-width:320px}
.search input{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;min-width:36px}
.ctl button:hover{border-color:var(--line-strong)}
.ctl label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;padding-left:6px}
.map{grid-area:map;position:relative;min-width:0}
svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg.dragging{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hint{position:absolute;left:12px;top:12px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:8px;pointer-events:none;transition:opacity .4s}
.panel{grid-area:panel;background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:16px 18px 24px;min-height:0}
.panel h2{font-size:17px;font-weight:600;margin:0 0 2px;text-wrap:balance}
.panel .key{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.panel .type{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:999px;margin-bottom:10px}
.panel p{margin:0 0 12px;max-width:62ch}
.panel h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;text-align:left}
.chip small{display:block;color:var(--muted);font-size:11px}
.chip:hover{border-color:var(--line-strong)}
.doc{font-size:12.5px;color:var(--muted)}
.doc code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
.empty{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted)}
/* svg parts */
.grp-rect{stroke-width:1.2;rx:14}
.grp-title{font-weight:600;font-size:15px;fill:var(--ink)}
.grp-sub{font-size:11.5px;fill:var(--muted)}
.node rect{stroke-width:1.2;rx:8}
.node text{font-size:11.5px;fill:var(--ink);pointer-events:none}
.node .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;fill:var(--muted)}
.node{cursor:pointer}
.node.sel rect{stroke:var(--focus);stroke-width:2.5}
.node.hit rect{stroke:var(--focus);stroke-width:2}
.edge{fill:none;stroke:var(--line-strong);stroke-width:1.2;opacity:.75}
.edge.hl{stroke:var(--focus);stroke-width:2.2;opacity:1}
.edge.dim{opacity:.12}
.gedge{fill:none;stroke:var(--line-strong);stroke-width:2;opacity:.6;stroke-linecap:round}
.elabel{font-size:10px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.elabel.hl{fill:var(--ink)}
.node.dim{opacity:.35}
.grp-count{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width: 820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"bar" "map" "panel"}
  .panel{border-left:0;border-top:1px solid var(--line);max-height:42vh}
  .legend{display:none}
  .brand span{display:none}
}
@media (prefers-reduced-motion: reduce){ .hint{transition:none} }
</style>

<div class="app">
  <div class="bar">
    <div class="brand"><b>OnlineCert Systemkarte</b><span>Zertifikatsverwaltungssystem · Abhängigkeiten zum Reinzoomen</span></div>
    <div class="tabs" role="tablist" aria-label="Ansicht">
      <button role="tab" id="tab-system" aria-selected="true" data-view="system">Systemlandschaft</button>
      <button role="tab" id="tab-daten" aria-selected="false" data-view="daten">Datenmodell</button>
      <button role="tab" id="tab-regeln" aria-selected="false" data-view="regeln">Regelkette</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Suchen: Billomat, R18, Zertifikate …" aria-label="Knoten suchen"></div>
    <div class="ctl">
      <button id="zin" title="Vergrößern" aria-label="Vergrößern">+</button>
      <button id="zout" title="Verkleinern" aria-label="Verkleinern">−</button>
      <button id="fit" title="Alles anzeigen">Alles</button>
      <label><input type="checkbox" id="always"> Details immer</label>
    </div>
  </div>
  <div class="map">
    <svg id="svg" aria-label="Systemkarte">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line-strong)"/></marker>
        <marker id="arr-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--focus)"/></marker>
      </defs>
      <g id="root"></g>
    </svg>
    <div class="hint" id="hint">Rad oder Finger zum Zoomen · Gruppe anklicken zum Reinzoomen · Knoten anklicken für Abhängigkeiten</div>
    <div class="legend" id="legend"></div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

/* ---------- LAYOUT ---------- */
const NW=168,NH=46,GAP=12,PAD=16,HEAD=52,COLGAP=110,ROWGAP=40;
function layout(view){
  const cols={};
  view.groups.forEach(g=>{
    const n=g.children.length; const c=Math.min(n<=4?2:3,n); const r=Math.ceil(n/c);
    g.w=PAD*2+c*NW+(c-1)*GAP; g.h=HEAD+PAD+r*NH+(r-1)*GAP+PAD; g.cols=c;
    (cols[g.col]=cols[g.col]||[]).push(g);
  });
  let x=0; const colKeys=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const maxH=Math.max(...colKeys.map(k=>cols[k].reduce((s,g)=>s+g.h,0)+(cols[k].length-1)*ROWGAP));
  colKeys.forEach(k=>{
    const gs=cols[k]; const w=Math.max(...gs.map(g=>g.w)); const tot=gs.reduce((s,g)=>s+g.h,0)+(gs.length-1)*ROWGAP;
    let y=(maxH-tot)/2;
    gs.forEach(g=>{ g.x=x+(w-g.w)/2; g.y=y; y+=g.h+ROWGAP;
      g.children.forEach((ch,i)=>{ const ci=i%g.cols, ri=Math.floor(i/g.cols); ch.x=g.x+PAD+ci*(NW+GAP); ch.y=g.y+HEAD+ri*(NH+GAP); ch.group=g; });
    });
    x+=w+COLGAP;
  });
  view.byId={}; view.groups.forEach(g=>g.children.forEach(c=>view.byId[c.id]=c));
  view.edgeObjs=view.edges.map(([a,b,l])=>({a:view.byId[a],b:view.byId[b],l:l||''})).filter(e=>e.a&&e.b);
  view.bounds={x:0,y:0,w:x-COLGAP,h:maxH};
}

function animateTo(t,dur){

  const W=svg.clientWidth,H=svg.clientHeight; cx=cx==null?W/2:cx; cy=cy==null?H/2:cy;
  const k=Math.max(0.15,Math.min(5,T.k*f)); const r=k/T.k;
  animateTo({k,x:cx-(cx-T.x)*r,y:cy-(cy-T.y)*r},160);
}
/* Pan, Wheel-Zoom, Pinch */
let drag=null; const pts=new Map();
svg.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===1){ drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y,moved:false}; svg.setPointerCapture(e.pointerId);} });
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const cx=(a.x+b.x)/2-svg.getBoundingClientRect().left, cy=(a.y+b.y)/2-svg.getBoundingClientRect().top;
    if(drag&&drag.pd){ const f=d/drag.pd; const k=Math.max(0.15,Math.min(5,T.k*f)); const r=k/T.k; T.k=k; T.x=cx-(cx-T.x)*r; T.y=cy-(cy-T.y)*r; applyT(); }
    drag=drag||{}; drag.pd=d; drag.moved=true; return; }
  if(drag&&drag.tx!=null){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3){ drag.moved=true; svg.classList.add('dragging'); } T.x=drag.tx+dx; T.y=drag.ty+dy; applyT(); }
});
const endPtr=e=>{ pts.delete(e.pointerId); if(pts.size===0){ if(drag&&drag.moved) svg.dataset.moved='1'; drag=null; svg.classList.remove('dragging'); } };
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); const f=Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0015)); const cx=e.clientX-r.left, cy=e.clientY-r.top; const k=Math.max(0.15,Math.min(5,T.k*f)); const rr=k/T.k; T.k=k; T.x=cx-(cx-T.x)*rr; T.y=cy-(cy-T.y)*rr; applyT(); },{passive:false});
svg.addEventListener('click',e=>{ if(svg.dataset.moved){ delete svg.dataset.moved; return; } if(e.target===svg||e.target.id==='root'){ select(null);} });
svg.addEventListener('dblclick',e=>{ if(e.target===svg) fitAll(); });

function edgePath(a,b){
  const ax=a.x+NW/2, ay=a.y+NH/2, bx=b.x+NW/2, by=b.y+NH/2; const dx=bx-ax, dy=by-ay;
  if(Math.abs(dx)>Math.abs(dy)*0.8){ const sx=dx>0?a.x+NW:a.x, tx=dx>0?b.x:b.x+NW, c=Math.max(40,Math.abs(tx-sx)/2); return `M${sx},${ay} C${sx+(dx>0?c:-c)},${ay} ${tx-(dx>0?c:-c)},${by} ${tx},${by}`; }
  const sy=dy>0?a.y+NH:a.y, ty=dy>0?b.y:b.y+NH, c=Math.max(30,Math.abs(ty-sy)/2); return `M${ax},${sy} C${ax},${sy+(dy>0?c:-c)} ${bx},${ty-(dy>0?c:-c)} ${bx},${ty}`;
}
function gEdgePath(ga,gb){
  const ax=ga.x+ga.w/2, ay=ga.y+ga.h/2, bx=gb.x+gb.w/2, by=gb.y+gb.h/2; const dx=bx-ax;
  if(Math.abs(dx)<10){ const dy=by-ay; const sy=dy>0?ga.y+ga.h:ga.y, ty=dy>0?gb.y:gb.y+gb.h; return `M${ax},${sy} C${ax},${sy+(dy>0?40:-40)} ${bx},${ty-(dy>0?40:-40)} ${bx},${ty}`; }
  const sx=dx>0?ga.x+ga.w:ga.x, tx=dx>0?gb.x:gb.x+gb.w, c=Math.max(60,Math.abs(tx-sx)/2); return `M${sx},${ay} C${sx+(dx>0?c:-c)},${ay} ${tx-(dx>0?c:-c)},${by} ${tx},${by}`;
}
function trunc(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}

/* ---------- RENDER ---------- */
let L={};
function render(viewKey){
  cur=VIEWS[viewKey]; layout(cur); selected=null; root.innerHTML='';
  const agg={}; cur.edgeObjs.forEach(e=>{ if(e.a.group===e.b.group) return; const key=e.a.group.id+'>'+e.b.group.id; (agg[key]=agg[key]||{a:e.a.group,b:e.b.group,n:0}).n++; });
  L.gedges=el('g',{class:'gedges'},root);
  Object.values(agg).forEach(d=>el('path',{class:'gedge',d:gEdgePath(d.a,d.b),'marker-end':'url(#arr)','data-w':(1.2+Math.min(4,d.n*0.5))},L.gedges));
  L.groups=el('g',{class:'groups'},root);
  cur.groups.forEach(g=>{
    const gg=el('g',{class:'grp'},L.groups); gg.addEventListener('click',e=>{ e.stopPropagation(); if(svg.dataset.moved){delete svg.dataset.moved;return;} zoomTo(g.x,g.y,g.w,g.h); });
    el('rect',{class:'grp-rect',x:g.x,y:g.y,width:g.w,height:g.h,fill:KINDS[g.kind].bg,stroke:KINDS[g.kind].c},gg);
    el('text',{class:'grp-title',x:g.x+PAD,y:g.y+24},gg,g.name).__data=g;
    el('text',{class:'grp-sub',x:g.x+PAD,y:g.y+41},gg,KINDS[g.kind].name);
    el('text',{class:'grp-count',x:g.x+g.w-PAD,y:g.y+24,'text-anchor':'end'},gg,g.children.length+' Bausteine');
  });
  L.edges=el('g',{class:'edges'},root);
  cur.edgeObjs.forEach(e=>{
    e.path=el('path',{class:'edge',d:edgePath(e.a,e.b),'marker-end':'url(#arr)'},L.edges);
    e.label=el('text',{class:'elabel','text-anchor':'middle',x:(e.a.x+e.b.x)/2+NW/2,y:(e.a.y+e.b.y)/2+NH/2-4},L.edges,e.l);
  });
  L.nodes=el('g',{class:'nodes'},root);
  cur.groups.forEach(g=>g.children.forEach(d=>{
    d.el=el('g',{class:'node',id:'n-'+d.id},L.nodes); d.el.addEventListener('click',e=>{ e.stopPropagation(); if(svg.dataset.moved){delete svg.dataset.moved;return;} select(d); });
    el('rect',{x:d.x,y:d.y,width:NW,height:NH,fill:'var(--surface)',stroke:KINDS[g.kind].c},d.el);
    el('text',{x:d.x+10,y:d.y+19},d.el,trunc(d.name,24));
    el('text',{class:'k',x:d.x+10,y:d.y+35},d.el,trunc(d.key,28));
  }));
  buildLegend(); panelIntro(); fitAll();
}
function applyLOD(){
  if(!L.nodes) return;
  const detail=always||T.k>=LOD||!!selected;
  L.nodes.style.opacity=detail?1:0; L.nodes.style.pointerEvents=detail?'auto':'none';
  L.edges.style.opacity=detail?1:0; L.gedges.style.opacity=detail?0.15:0.8;
  /* Semantischer Zoom: in der Übersicht bleiben Gruppentitel lesbar, Pfeile sichtbar */
  const f=detail?1:Math.min(2.6,1.15/T.k);
  $$('.grp').forEach(g=>{ g.style.cursor=detail?'default':'zoom-in';
    g.querySelector('.grp-title').style.fontSize=(15*f)+'px'; g.querySelector('.grp-sub').style.fontSize=(11.5*f)+'px'; g.querySelector('.grp-count').style.fontSize=(11*f)+'px';
    const t=g.querySelector('.grp-title'), d=t.__data; if(d){ t.setAttribute('y',d.y+24*f); g.querySelector('.grp-sub').setAttribute('y',d.y+24*f+17*f); g.querySelector('.grp-count').setAttribute('y',d.y+24*f); }
  });
  $$('.gedge').forEach(e=>{ e.style.strokeWidth=(parseFloat(e.dataset.w)*(detail?1:Math.max(1,0.8/T.k)))+'px'; });
}
function fitAll(){const b=cur.bounds; zoomTo(b.x-20,b.y-20,b.w+40,b.h+40);}
function touches(e,d){return e.a.id===d.id||e.b.id===d.id;}
function select(d,doZoom){
  selected=d;
  cur.groups.forEach(g=>g.children.forEach(n=>{ n.el.classList.toggle('sel',!!d&&n.id===d.id); n.el.classList.toggle('dim',!!d&&n.id!==d.id&&!cur.edgeObjs.some(e=>(e.a.id===d.id&&e.b.id===n.id)||(e.b.id===d.id&&e.a.id===n.id))); }));
  cur.edgeObjs.forEach(e=>{ const on=!!d&&touches(e,d); e.path.classList.toggle('hl',on); e.path.classList.toggle('dim',!!d&&!on); e.path.setAttribute('marker-end',on?'url(#arr-hl)':'url(#arr)'); e.label.classList.toggle('hl',on); e.label.style.opacity=d?(on?1:0):1; });
  applyLOD();
  if(d){ panelNode(d); if(doZoom) zoomTo(d.x-NW*1.2,d.y-NH*2,NW*3.4,NH*5); } else panelIntro();
}
function buildLegend(){
  const kinds=[...new Set(cur.groups.map(g=>g.kind))];
  $('#legend').innerHTML=kinds.map(kd=>`<span><i style="background:${KINDS[kd].c}"></i>${KINDS[kd].name}</span>`).join('')+'<span>Pfeil = Abhängigkeit / löst aus</span>';
}
/* ---------- PANEL ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function panelIntro(){
  const n=cur.groups.reduce((s,g)=>s+g.children.length,0);
  $('#panel').innerHTML=`<h2>${cur.title}</h2><div class="key">${n} Bausteine · ${cur.edgeObjs.length} Abhängigkeiten · ${cur.groups.length} Gruppen</div><p>${cur.intro}</p>
  <div class="stats"><div><b>${cur.groups.length}</b><span>Gruppen</span></div><div><b>${n}</b><span>Bausteine</span></div><div><b>${cur.edgeObjs.length}</b><span>Pfeile</span></div></div>
  <h3>Gruppen</h3><div class="chips">${cur.groups.map(g=>`<button class="chip" data-grp="${g.id}">${esc(g.name)}<small>${g.children.length} Bausteine</small></button>`).join('')}</div>
  <h3>Quellen im Repo</h3><div class="doc">docs/zertifikatssystem/<code>anforderungskatalog.md</code>, <code>runde-2-automatisierung-ux-billomat.md</code>, <code>abgleich-zms-katalog-v1-3.md</code></div>`;
  $$('#panel [data-grp]').forEach(b=>b.addEventListener('click',()=>{const g=cur.groups.find(x=>x.id===b.dataset.grp); zoomTo(g.x,g.y,g.w,g.h);}));
}
function panelNode(d){
  const inn=cur.edgeObjs.filter(e=>e.b.id===d.id), out=cur.edgeObjs.filter(e=>e.a.id===d.id);
  const chip=(n,l)=>`<button class="chip" data-node="${n.id}">${esc(n.name)}${l?`<small>${esc(l)}</small>`:''}</button>`;
  const isRule=cur===VIEWS.regeln, isData=cur===VIEWS.daten;
  const inTitle=isRule?'Wird ausgelöst von':isData?'Wird referenziert von':'Braucht Eingaben von';
  const outTitle=isRule?'Löst aus':isData?'Verweist auf':'Liefert an';
  $('#panel').innerHTML=`<span class="type" style="background:${KINDS[d.group.kind].bg};color:${KINDS[d.group.kind].c}">${esc(d.group.name)}</span><h2>${esc(d.name)}</h2><div class="key">${esc(d.key)}</div><p>${esc(d.desc)}</p>
  <h3>${inTitle} (${inn.length})</h3><div class="chips">${inn.length?inn.map(e=>chip(e.a,e.l)).join(''):'<span class="empty">keine</span>'}</div>
  <h3>${outTitle} (${out.length})</h3><div class="chips">${out.length?out.map(e=>chip(e.b,e.l)).join(''):'<span class="empty">keine</span>'}</div>
  <h3>Nachlesen</h3><div class="doc">${esc(d.doc)}</div>
  <h3>Navigation</h3><div class="chips"><button class="chip" id="back">Zurück zur Übersicht</button><button class="chip" id="zoomgrp">Gruppe „${esc(d.group.name)}“ anzeigen</button></div>`;
  $$('#panel [data-node]').forEach(b=>b.addEventListener('click',()=>select(cur.byId[b.dataset.node],true)));
  $('#back').addEventListener('click',()=>{select(null);fitAll();});
  $('#zoomgrp').addEventListener('click',()=>zoomTo(d.group.x,d.group.y,d.group.w,d.group.h));
}
/* ---------- BEDIENUNG ---------- */
$$('.tabs button').forEach(b=>b.addEventListener('click',()=>{ $$('.tabs button').forEach(x=>x.setAttribute('aria-selected','false')); b.setAttribute('aria-selected','true'); render(b.dataset.view); try{localStorage.setItem('oc-map-view',b.dataset.view);}catch(e){} }));
$('#zin').addEventListener('click',()=>scaleBy(1.4));
$('#zout').addEventListener('click',()=>scaleBy(1/1.4));
$('#fit').addEventListener('click',()=>{select(null);fitAll();});
$('#always').addEventListener('change',e=>{always=e.target.checked;applyLOD();});
const q=$('#q');
function matches(d,s){return d.name.toLowerCase().includes(s)||d.key.toLowerCase().includes(s)||d.id.toLowerCase().includes(s);}
q.addEventListener('input',()=>{ const s=q.value.trim().toLowerCase(); cur.groups.forEach(g=>g.children.forEach(d=>d.el.classList.toggle('hit',!!s&&matches(d,s)))); always=s?true:$('#always').checked; applyLOD(); });
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const s=q.value.trim().toLowerCase(); const hit=cur.groups.flatMap(g=>g.children).find(d=>matches(d,s)); if(hit) select(hit,true);} });
window.addEventListener('keydown',e=>{ if(e.key==='Escape') select(null); });
window.addEventListener('resize',()=>{ if(!selected) fitAll(); });
setTimeout(()=>{$('#hint').style.opacity=0;},9000);

let start='system'; try{ const s=localStorage.getItem('oc-map-view'); if(s&&VIEWS[s]) start=s; }catch(e){}
$$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===start?'true':'false'));
render(start);
</script>
